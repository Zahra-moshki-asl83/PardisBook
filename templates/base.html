{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}پردیس‌بوک | سامانه مدیریت کتابخانه{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{% url 'core:home' %}">
    <span class="brand-mark">پ</span>
    <span><strong>PardisBook</strong><small>سامانه مدیریت کتابخانه</small></span>
  </a>
  <nav>
    <a href="{% url 'core:home' %}">خانه</a>
    <a href="{% url 'books:list' %}">کتاب‌ها</a>
    <a href="{% url 'accounts:login' %}">ورود</a>
    <a class="nav-cta" href="{% url 'accounts:register' %}">عضویت</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer">پردیس‌بوک — کتاب، پلی به سوی فردای بهتر</footer>
</body>
</html>
